name: Generar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Android
        run: |
          unzip -o EstadoPrivado_Android_Project.zip -d android-project
          find android-project -maxdepth 3 -type f | head -50

      - name: Encontrar proyecto Gradle
        run: |
          echo "Buscando gradlew..."
          find android-project -name gradlew -type f

      - name: Compilar APK
        run: |
          PROJECT=$(dirname "$(find android-project -name gradlew -type f | head -1)")
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Estado-Privado-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
